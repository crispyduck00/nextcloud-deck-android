name: Android CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  validation:
    name: Validate Gradle Wrapper
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Validate Gradle Wrapper
        uses: gradle/actions/wrapper-validation@v6.2.0

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          check-latest: true
          cache: 'gradle'
      - name: Lint
        run: bash ./gradlew :app:lintDevDebug :cross-tab-drag-and-drop:lintDebug :tab-layout-helper:lintDebug --stacktrace --no-configuration-cache
      - name: Upload lint reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: app-fork-lint
          path: app/build/reports/lint-results-devDebug.*

  test:
    name: Unit tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          check-latest: true
          cache: 'gradle'
      - name: Unit tests
        run: bash ./gradlew test --stacktrace --no-configuration-cache

  apk:
    name: Generate APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: 'temurin'
          java-version: '17'
          check-latest: true
          cache: 'gradle'
      - name: Build debug APK
        run: bash ./gradlew assembleDevDebug --no-configuration-cache
      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: app-fork-debug
          path: app/build/outputs/apk/dev/debug/app-dev-debug.apk
